<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>535250144</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Quicksand:wght@400;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <svg width="0" height="0" style="position:absolute">
    <filter id="rough-edge">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" result="noise" seed="4"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6"/>
    </filter>
    <filter id="rough-edge-lg">
      <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="2" result="noise" seed="9"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="9"/>
    </filter>
  </svg>

  <svg class="deco deco-leaf-1" viewBox="0 0 60 60" width="46">
    <path d="M30 5 C45 10 52 28 40 45 C28 55 10 48 8 32 C6 16 15 0 30 5 Z" fill="#8AA57C" opacity="0.5"/>
    <path d="M30 8 C30 20 30 35 22 48" stroke="#6B4F3B" stroke-width="1.2" fill="none" opacity="0.4"/>
  </svg>

  <main class="container">
    <h1>Expense Tracker</h1>

    <form id="expense-form">
      <input type="text" id="expense-name" placeholder="Nama/keterangan pengeluaran" required>
      <input type="number" id="expense-amount" placeholder="Nominal (Rp)" min="1" required>
      <button type="submit">+ Tambah</button>
    </form>

    <section class="summary">
      <div class="summary-box summary-box--main">
        <span class="summary-label">Total Pengeluaran</span>
        <span id="total-amount">Rp0</span>
      </div>
      <div class="summary-box summary-box--sub">
        <span class="summary-label">Jumlah Data</span>
        <span id="total-count">0</span>
      </div>
    </section>


    <ul id="expense-list"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
